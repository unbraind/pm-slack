name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify pm project integrity and merge safety
        shell: bash
        run: |
          set -euo pipefail
          # `pm validate` is deliberately NOT the command here. After a same-field merge
          # conflict the field-aware driver writes a marker-free .toon that already holds
          # the winning value and records the discarded peer value in a clone-local
          # receipt. That file is valid TOON, so `pm validate` returns ok:true while
          # another agent's edit has been silently dropped. `pm health` is the only
          # surface that goes red, via integrity.counts.pending_merge_decisions.
          #
          # --strict-exit is load-bearing: a bare `pm health` exits 0 EVEN WHEN ok:false,
          # so without this flag the step is a no-op that always passes.
          #
          # A fresh runner checkout has no merge drivers installed. That is a warn, not a
          # failure (upstream GH-815), so this gate does not need `pm merge install`.
          ./node_modules/.bin/pm health --strict-exit

      - name: Type check
        run: npm run typecheck

      - name: Build and verify committed output is current
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify Bun can install the package graph
        run: bun install --no-save
